<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="./style.css" />

    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/chicken-small.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/endboss-status-bar.class.js"></script>
    <script src="./models/bottle-status-bar.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/coin-status-bar.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/game-over-screen.class.js"></script>
    <script src="./js/game.js"></script>
    <script src="./levels/level1.js"></script>
  </head>
  <body>
    <h1>El pollo loco</h1>
    <div id="fullscreen">
      <canvas id="canvas" width="720" height="480"> </canvas>
      <div id="startscreen">
        <button type="button" onclick="startGame()">Spiel starten</button>
      </div>

      <button id="restart-button" type="button" onclick="restartGame()" hidden>
        Nochmal spielen
      </button>

      <button
        type="button"
        class="fullscreen-button"
        onclick="fullscreen()"
        aria-label="Vollbild aktivieren"
        title="Vollbild aktiveiren"
      >
        ⛶
      </button>

      <button
        type="button"
        class="fullscreen-button music-button"
        onclick="toggleMusic(this)"
        aria-label="Hintergrundmusik"
        aria-pressed="false"
        title="Musik einschalten"
      >
        ♪
      </button>

      <details class="controls-help">
        <summary>Steuerung</summary>
        <div class="controls-panel">
          <strong>Tastenbelegung</strong>
          <p><kbd>←</kbd> Nach links laufen</p>
          <p><kbd>→</kbd> Nach rechts laufen</p>
          <p><kbd>W</kbd> Springen</p>
          <p><kbd>Leertaste</kbd> Flasche werfen</p>
        </div>
      </details>
    </div>
  </body>
</html>
