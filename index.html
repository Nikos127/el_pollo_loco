<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/responsive.css" />
    <link
      rel="icon"
      type="image/png"
      href="./img/6_salsa_bottle/salsa_bottle.png"
    />

    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/chicken-small.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/endboss-status-bar.class.js"></script>
    <script src="./models/bottle-status-bar.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/coin-status-bar.class.js"></script>
    <script src="./models/world-renderer.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/game-over-screen.class.js"></script>
    <script src="./js/game.js"></script>
    <script src="./levels/level1.js"></script>
  </head>
  <body>
    <h1>El pollo loco</h1>
    <div id="fullscreen">
      <canvas id="canvas" width="720" height="480"> </canvas>
      <div id="startscreen">
        <button type="button" onclick="startGame()">Spiel starten</button>
      </div>

      <button id="restart-button" type="button" onclick="restartGame()" hidden>
        Nochmal spielen
      </button>

      <button
        id="menu-button"
        class="fullscreen-button"
        type="button"
        onclick="location.reload()"
        aria-label="Zum Menü"
        title="Zum Menü"
      >
        Hauptmenü
      </button>

      <button
        id="fullscreen-button"
        type="button"
        class="fullscreen-button"
        onclick="toggleFullscreen()"
        aria-label="Klicken für Vollbild"
        title="Klicken für Vollbild"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M9 9L3 3 M3 8V3H8 M15 9L21 3 M16 3H21V8 M9 15L3 21 M3 16V21H8 M15 15L21 21 M16 21H21V16"
          />
        </svg>
      </button>

      <button
        type="button"
        class="fullscreen-button music-button"
        onclick="toggleMusic(this)"
        aria-label="Hintergrundmusik"
        aria-pressed="false"
        title="Musik einschalten"
      >
        ♪
      </button>

      <button
        id="pause-button"
        type="button"
        class="fullscreen-button pause-button"
        onclick="togglePause()"
        aria-pressed="false"
        aria-label="Spiel pausieren"
        title="Spiel pausieren"
        hidden
      >
        &#10074;&#10074;
      </button>

      <details class="controls-help">
        <summary>Steuerung</summary>
        <div class="controls-panel">
          <strong>Tastenbelegung</strong>
          <p><kbd>←</kbd> Nach links laufen</p>
          <p><kbd>→</kbd> Nach rechts laufen</p>
          <p><kbd>W</kbd> Springen</p>
          <p><kbd>Leertaste</kbd> Flasche werfen</p>
          <p><kbd>P</kbd> Pause / Fortsetzen</p>
        </div>
      </details>
      <div class="mobile-controls">
        <div class="mobile-controls-group">
          <button type="button" data-key="LEFT" aria-label="Nach links">
            &#8592;
          </button>
          <button type="button" data-key="RIGHT" aria-label="Nach rechts">
            &#8594;
          </button>
        </div>

        <div class="mobile-controls-group">
          <button type="button" data-key="W" aria-label="Springen">
            &#8593;
          </button>
          <button type="button" data-key="SPACE" aria-label="Flasche werfen">
            <img
              src="./img/6_salsa_bottle/salsa_bottle.png"
              alt=""
              draggable="false"
            />
          </button>
        </div>
      </div>
      <a class="imprint-link" href="impressum.html">Impressum</a>
      <div id="orientation-notice" role="status">
        <p>Bitte drehe dein Gerät ins Querformat, um zu spielen.</p>
      </div>
    </div>
  </body>
</html>
